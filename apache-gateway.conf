# CentOS only. MIS places this under /etc/httpd/conf.d/ if .htaccess is ignored.
# Disk: /var/www/html/api/lcr/
# This vhost is not changed here. SSL stays the existing Sakata certificate.

<Directory "/var/www/html/api/lcr">
    AllowOverride FileInfo
    Options FollowSymLinks
    AcceptPathInfo On
    DirectoryIndex ccrogw.php
    Require all granted
</Directory>

<Directory "/var/www/html/api/lcr/rp">
    AllowOverride FileInfo
    Options FollowSymLinks
    AcceptPathInfo On
    DirectoryIndex index.php
    Require all granted
</Directory>
